<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>YouTube Hider</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    
    <h2 class="title">YouTube Hider 🔒</h2>
    
    <div class="toggle-row">
      <span>Hide Home Feed</span>
      <label class="switch">
        <input type="checkbox" id="toggleHomeFeed">
        <span class="slider"></span>  
      </label>
    </div>

    <div class="toggle-row">
      <span>Hide Shorts</span>
      <label class="switch">
        <input type="checkbox" id="toggleShortsFeed">
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span>Hide Recommended Videos</span>
      <label class="switch">
        <input type="checkbox" id="toggleRecommendedVideos">
        <span class="slider"></span>
      </label>
    </div>


    <div class="toggle-row">
      <span>Hide Recommended Playlist</span>
      <label class="switch">
        <input type="checkbox" id="togglePlaylist">
        <span class="slider"></span>
      </label>
    </div>


    <div class="toggle-row">
      <span>Hide Livechat</span>
      <label class="switch">
        <input type="checkbox" id="toggleLivechat">
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span>Hide Comments</span>
      <label class="switch">
        <input type="checkbox" id="toggleComments">
        <span class="slider"></span>
      </label>
    </div>


    <div class="button-footer">
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSeaB7nERVFtwhJsmstc0QJmcTqF61kHF3AHOoaa57ULLHF35Q/viewform?usp=dialog" target="_blank" class="footer-btn feedback-btn">
        Feedback & Support 💬
        <small>Bugs • Features • Reviews</small>
      </a>
      <a href="https://muhammadabubakarqureshi.github.io/youtube-hider-release-notes/" target="_blank" class="footer-btn notes-btn">
        Release Notes 📝
      </a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
